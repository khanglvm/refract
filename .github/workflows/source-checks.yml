name: Source checks

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: [package.json]

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        react: ['18', '19']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts && npm rebuild esbuild
      - name: Use React ${{ matrix.react }}
        if: matrix.react != '18'
        run: npm install --no-save --ignore-scripts react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - name: Type-check
        run: npm run type-check
      - name: Unit tests
        run: npm test
      - name: Build and check the package
        run: npm run clean && npm run build && npm run test:package
